services:
  postgres:
    image: imresamu/postgis:17-3.5-alpine
    container_name: farmflow-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: farmflow
    ports:
      - "5432:5432"
    volumes:
      - farmflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farmflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  farmflow_pgdata:
